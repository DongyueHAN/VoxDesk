[project]
name = "voxdesk-demo"
version = "0.1.0"
description = "临时 demo：语音 → ASR → DeepSeek API → TTS（云 LLM，分支专用）"
requires-python = "==3.11.*"
dependencies = [
    "soundcard>=0.4.6",
    "voxdesk-audio",
    "voxdesk-tts",
]

[tool.uv.sources]
voxdesk-audio = { path = "../audio", editable = true }
voxdesk-tts = { path = "../tts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxdesk_demo"]

[tool.uv]
package = true
