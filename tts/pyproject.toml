[project]
name = "voxdesk-tts"
version = "0.1.0"
description = "VoxDesk TTS 切片：S0 = SAPI 出声"
requires-python = "==3.11.*"
dependencies = [
    "pywin32>=306",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxdesk_tts"]

[tool.uv]
package = true
